################################### PDE-MANAGER PACKAGE METADATA ###################################

[package]
name = "pde-manager"
edition = "2024"

[dependencies]      # Ensure only the necessary features are enabled wherever applicable
ctrlc = "3.5"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
home = "0.5"
lexopt = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
self-replace = "1.5"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
tar = { version = "0.4", default-features = false }
toml = { version = "1.0", default-features = false, features = ["parse", "serde"] }
xz2 = "0.1"
zip = { version = "8.2", default-features = false, features = ["deflate-flate2"] }

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Better optimization, slower compile
strip = true        # Strip symbols from binary
panic = "abort"     # Remove unwinding code
