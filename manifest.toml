[[list]]
group = "ai"
[list.meta]
name = "opencode"
version = "1.2.20"
[list.installer]
type = "release_asset"
repo = "anomalyco/opencode"
tag = "v{version}"
asset = "{name}-linux-x64"
ext = ".tar.gz"
bin = "{name}"
