[[list]]
group = "neovim"
[list.meta]
name = "ripgrep"
version = "15.1.0"
[list.installer]
type = "release_asset"
repo = "BurntSushi/ripgrep"
asset = "{name}-{version}-x86_64-unknown-linux-musl"
ext = ".tar.gz"
bin = "{asset}/rg"

[[list]]
group = "neovim"
[list.meta]
name = "tree-sitter"
version = "0.26.6"
[list.installer]
type = "release_asset"
repo = "tree-sitter/tree-sitter"
tag = "v{version}"
asset = "{name}-linux-x64"
ext = ".gz"
bin = "{name}"

[[list]]
group = "neovim"
[list.meta]
name = "clangd"
version = "21.1.8"
[list.installer]
type = "release_asset"
repo = "clangd/clangd"
asset = "{name}-linux-{version}"
ext = ".zip"
pkg = true
bin = "{name}_{version}/bin/{name}"

[[list]]
group = "neovim"
[list.meta]
name = "lua-language-server"
version = "3.17.1"
[list.installer]
type = "release_asset"
repo = "LuaLS/lua-language-server"
asset = "{name}-{version}-linux-x64"
ext = ".tar.gz"
pkg = true
bin = "bin/{name}"

[[list]]
group = "neovim"
[list.meta]
name = "codelldb"
version = "1.12.1"
[list.installer]
type = "release_asset"
repo = "vadimcn/codelldb"
tag = "v{version}"
asset = "{name}-linux-x64"
ext = ".vsix"
pkg = true
bin = "extension/adapter/{name}"

[[list]]
group = "neovim"
[list.meta]
name = "debugpy"
version = "1.8.20"
[list.installer]
type = "python_venv"
pkg = "{name}"

