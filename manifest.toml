asset = "{name}-linux-x64"
ext = ".tar.gz"
install_as = "copy"
path = "{name}"

############################## GIT COMPONENTS #############################

[[list]]
group = "git"
[list.meta]
name = "lazygit"
version = "0.54.2"
[list.installer]
type = "release_asset"
repo = "jesseduffield/lazygit"
tag = "v{version}"
asset = "{name}_{version}_linux_x86_64"
ext = ".tar.gz"
install_as = "copy"
path = "{name}"

[[list]]
group = "git"
[list.meta]
name = "delta"
version = "0.18.2"
[list.installer]
type = "release_asset"
repo = "dandavison/delta"
asset = "{name}-{version}-x86_64-unknown-linux-gnu"
ext = ".tar.gz"
install_as = "copy"
path = "{asset}/{name}"

