############################ NEOVIM COMPONENTS ############################

[[list]]
group = "neovim"
[list.meta]
name = "neovim"
version = "0.11.6"
[list.installer]
type = "build_source"
repo = "neovim/neovim"
tag = "v{version}"
commands = [
    "make -j8 CMAKE_BUILD_TYPE=RelWithDebInfo CMAKE_INSTALL_PREFIX={install_prefix}",
    "make install",
]
items = ["bin/nvim", "lib/nvim", "share/nvim"]

[[list]]
group = "neovim"
[list.meta]
name = "ripgrep"
version = "15.1.0"
[list.installer]
type = "release_asset"
repo = "BurntSushi/ripgrep"
asset = "{name}-{version}-x86_64-unknown-linux-musl"
ext = ".tar.gz"
install_as = "copy"
path = "{asset}/rg"

[[list]]
group = "neovim"
[list.meta]
name = "tree-sitter"
version = "0.26.6"
[list.installer]
type = "release_asset"
repo = "tree-sitter/tree-sitter"
tag = "v{version}"
asset = "{name}-linux-x64"
ext = ".gz"
install_as = "copy"
path = "{name}"

################ LANGUAGE SERVERS ################

[[list]]
group = "neovim"
[list.meta]
name = "clangd"
version = "21.1.8"
[list.installer]
type = "release_asset"
repo = "clangd/clangd"
asset = "{name}-linux-{version}"
ext = ".zip"
install_as = "folders"
path = "{name}_{version}"

[[list]]
group = "neovim"
[list.meta]
name = "lua-language-server"
version = "3.17.1"
[list.installer]
type = "release_asset"
repo = "LuaLS/lua-language-server"
asset = "{name}-{version}-linux-x64"
ext = ".tar.gz"
install_as = "symlink"
path = "bin/{name}"

################# DEBUG ADAPTERS #################

[[list]]
group = "neovim"
[list.meta]
name = "codelldb"
version = "1.12.1"
[list.installer]
type = "release_asset"
repo = "vadimcn/codelldb"
tag = "v{version}"
asset = "{name}-linux-x64"
ext = ".vsix"
install_as = "symlink"
path = "extension/adapter/{name}"

[[list]]
group = "neovim"
[list.meta]
name = "debugpy"
version = "1.8.20"
[list.installer]
type = "python_venv"
