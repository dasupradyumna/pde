#################################### INSTALL SPECIFICATION LIST ####################################

[[list]]
group = "wezterm"
[list.meta]
name = "wezterm"
version = "nightly"
[list.installer]
type = "release_asset"
repo = "wezterm/wezterm"
asset = "{name}-{version}.Ubuntu24.04"
ext = ".tar.xz"
install_as = "folders"
path = "{name}/usr"

